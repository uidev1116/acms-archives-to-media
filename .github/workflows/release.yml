name: Release

# Build the plugin zip (scripts/package.php) and publish it as a GitHub Release.
# Pushing a tag like v1.2.3 triggers this.
#
# The plugin version lives in src/ServiceProvider.php ($version). Keep the tag and that value in
# sync — the "Verify" step below fails the run if they disagree, so no mismatched zip is published.
#
# scripts/namespace.php (the skeleton's one-time renamer, which deletes itself) must be gone before a release is
# published; the guard step below skips the run while it still exists.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip release while the skeleton renamer still exists
        id: guard
        run: |
          if [ -f scripts/namespace.php ]; then
            echo "scripts/namespace.php present — the skeleton has not been renamed yet. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.guard.outputs.skip != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer

      - name: Verify tag matches ServiceProvider $version
        if: steps.guard.outputs.skip != 'true'
        run: php scripts/package.php --check-version="${GITHUB_REF_NAME#v}"

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # volta.node（Volta で固定した Node）を読む
          cache: npm

      - name: Build the admin UI (src/assets/dist is not committed)
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm ci
          npm run build

      - name: Create release package
        if: steps.guard.outputs.skip != 'true'
        run: php scripts/package.php

      - name: Create GitHub Release
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ./build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
