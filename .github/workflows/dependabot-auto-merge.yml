name: Dependabot auto-merge

# Auto-merge Dependabot PRs once the required checks pass:
#   - GitHub Actions (every action is pinned to a commit SHA): patch and minor updates
#   - Composer and npm: the *-production (minor / patch), *-development (major / minor / patch) and *-other
#     (minor / patch) groups (see .github/dependabot.yml). A major update of a production dependency opens its own
#     PR and is reviewed by hand.
# Note: the admin UI bundles React and @ablogcms/components and runs with administrator privileges, so a bad npm
# release would run with those privileges. That risk is accepted in exchange for automation; CI runs `npm audit`
# on every push.
#
# Requires (in repo Settings): "Allow auto-merge" enabled, and a branch protection rule on the
# default branch with the Test workflow as a required status check — otherwise --auto has no check
# to wait for and would merge without CI.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          (steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
          steps.metadata.outputs.dependency-group == 'npm-production' ||
          steps.metadata.outputs.dependency-group == 'npm-development' ||
          steps.metadata.outputs.dependency-group == 'npm-other' ||
          steps.metadata.outputs.dependency-group == 'composer-production' ||
          steps.metadata.outputs.dependency-group == 'composer-development' ||
          steps.metadata.outputs.dependency-group == 'composer-other'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
